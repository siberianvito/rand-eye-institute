name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Project page, so the site is served from a sub-path.
      # Delete this once a custom domain points at the repo root.
      NEXT_PUBLIC_BASE_PATH: /rand-eye-institute
      # GoHighLevel workflow Inbound Webhook URL.
      # Repo → Settings → Secrets and variables → Actions → LEAD_WEBHOOK_URL.
      # Static site, so this ends up in the client bundle either way — the
      # secret just keeps it out of the source. Never put a GHL API token here.
      NEXT_PUBLIC_LEAD_WEBHOOK: ${{ secrets.LEAD_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
